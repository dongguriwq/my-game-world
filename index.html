<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub - 내가 만드는 게임 모음</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap');
    
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      transform: translateY(-6px);
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 12px 30px -10px rgba(168, 85, 247, 0.3);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .text-gradient {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
          <i class="fa-solid fa-gamepad text-xl text-white"></i>
        </div>
        <span class="text-2xl font-extrabold tracking-tight text-gradient">GAME HUB</span>
      </div>

      <div class="flex items-center gap-3">
        <button type="button" onclick="copySiteLink()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition border border-slate-700 flex items-center gap-2">
          <i class="fa-solid fa-share-nodes text-purple-400"></i>
          <span>사이트 링크 공유</span>
        </button>
        <button type="button" onclick="openModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white text-sm font-semibold shadow-lg shadow-purple-600/20 transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i>
          <span>게임 추가</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

    <!-- Hero Section -->
    <section id="heroSection" class="relative rounded-3xl overflow-hidden glass border border-slate-800 p-8 md:p-12 hidden">
      <div class="absolute inset-0 bg-gradient-to-r from-purple-900/40 via-slate-900/80 to-slate-950 z-10"></div>
      <img id="heroBg" src="" alt="Hero Bg" class="absolute inset-0 w-full h-full object-cover filter blur-sm opacity-40">
      
      <div class="relative z-20 max-w-2xl space-y-4">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/20 border border-purple-500/30 text-purple-300 text-xs font-semibold">
          <i class="fa-solid fa-fire text-amber-400"></i>
          <span id="heroCategory">추천 게임</span>
        </div>
        <h1 id="heroTitle" class="text-3xl md:text-5xl font-extrabold text-white leading-tight"></h1>
        <p id="heroDesc" class="text-slate-300 text-sm md:text-base line-clamp-3 leading-relaxed"></p>
        <div class="pt-2">
          <a id="heroPlayBtn" href="#" target="_blank" class="inline-flex items-center gap-3 px-6 py-3.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold hover:scale-105 transition shadow-lg shadow-purple-600/30">
            <i class="fa-solid fa-play"></i>
            <span>지금 플레이하기</span>
          </a>
        </div>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="space-y-6">
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        <div id="categoryContainer" class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 custom-scrollbar"></div>

        <div class="relative w-full md:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="renderGames()" placeholder="게임 제목 검색..." class="w-full bg-slate-900/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
        </div>
      </div>
    </section>

    <!-- Game List Grid -->
    <section>
      <div id="gameGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <!-- Empty State -->
      <div id="emptyState" class="text-center py-20 glass rounded-3xl border border-slate-800/80 space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center mx-auto text-slate-500 text-2xl">
          <i class="fa-solid fa-ghost"></i>
        </div>
        <div class="space-y-1">
          <h3 class="text-lg font-bold text-slate-300">등록된 게임이 없습니다</h3>
          <p class="text-slate-500 text-sm">상단의 '게임 추가' 버튼을 눌러 나만의 게임 링크를 추가해 보세요!</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal for Adding/Editing Game -->
  <div id="gameModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl relative">
      <div class="flex items-center justify-between">
        <h3 id="modalTitle" class="text-xl font-bold text-white">새 게임 추가</h3>
        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="space-y-4">
        <input type="hidden" id="editGameId">

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">게임 제목 *</label>
          <input type="text" id="inputTitle" placeholder="예: 테트리스 웹" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">카테고리 *</label>
          <select id="selectCategory" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            <option value="🧠 머리쓰는 게임">🧠 머리쓰는 게임 (퍼즐/퀴즈/탈출)</option>
            <option value="⚡ 손맛/순발력">⚡ 손맛/순발력 (액션/리듬/슈팅)</option>
            <option value="☕ 가볍게 한판">☕ 가볍게 한판 (클릭커/심심풀이)</option>
            <option value="👥 여럿이 함께">👥 여럿이 함께 (멀티/대결/친구와)</option>
            <option value="📖 스토리/방탈출">📖 스토리/방탈출 (탐험/RPG)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">게임 플레이 링크 (URL) *</label>
          <input type="text" id="inputPlayUrl" placeholder="https://example.com/play" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">대표 이미지 URL (선택)</label>
          <input type="text" id="inputImageUrl" placeholder="https://images.unsplash.com/..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
          <p class="text-[11px] text-slate-500 mt-1">비워둘 경우 기본 배경 이미지가 적용됩니다.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">게임 설명 *</label>
          <textarea id="inputDesc" rows="3" placeholder="게임에 대한 간단한 규칙이나 설명을 적어주세요." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500 resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition">취소</button>
          <button type="button" onclick="saveGameData()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white text-sm font-semibold shadow-lg shadow-purple-600/20 transition">저장하기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl transition duration-300 transform translate-y-20 opacity-0 flex items-center gap-3 z-50">
    <i class="fa-solid fa-circle-check text-purple-400"></i>
    <span id="toastMsg" class="text-sm font-medium">알림 메시지</span>
  </div>

  <script>
    const CATEGORIES = [
      "전체",
      "🧠 머리쓰는 게임",
      "⚡ 손맛/순발력",
      "☕ 가볍게 한판",
      "👥 여럿이 함께",
      "📖 스토리/방탈출"
    ];

    let games = [];
    let currentCategory = "전체";

    document.addEventListener("DOMContentLoaded", () => {
      loadGames();
      renderCategoryButtons();
      renderGames();
    });

    function loadGames() {
      try {
        const saved = localStorage.getItem("gamehub_games");
        if (saved) {
          games = JSON.parse(saved);
        }
      } catch (e) {
        console.warn("localStorage 접근 불가, 메모리 모드로 동작합니다.");
        games = [];
      }
    }

    function saveGames() {
      try {
        localStorage.setItem("gamehub_games", JSON.stringify(games));
      } catch (e) {
        console.warn("localStorage 저장 실패");
      }
    }

    function renderCategoryButtons() {
      const container = document.getElementById("categoryContainer");
      container.innerHTML = CATEGORIES.map(cat => {
        const isActive = cat === currentCategory;
        const activeClass = isActive 
          ? "bg-purple-600 text-white shadow-lg shadow-purple-600/30" 
          : "bg-slate-800/80 text-slate-400 hover:bg-slate-700 hover:text-slate-200 border border-slate-700/50";
        return `
          <button type="button" onclick="setCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${activeClass}">
            ${cat}
          </button>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryButtons();
      renderGames();
    }

    function renderGames() {
      const searchKeyword = document.getElementById("searchInput").value.toLowerCase();
      const grid = document.getElementById("gameGrid");
      const emptyState = document.getElementById("emptyState");
      const heroSection = document.getElementById("heroSection");

      const filtered = games.filter(g => {
        const matchesCategory = currentCategory === "전체" || g.category === currentCategory;
        const matchesSearch = g.title.toLowerCase().includes(searchKeyword) || g.desc.toLowerCase().includes(searchKeyword);
        return matchesCategory && matchesSearch;
      });

      if (games.length > 0) {
        const featured = games[0];
        heroSection.classList.remove("hidden");
        document.getElementById("heroTitle").innerText = featured.title;
        document.getElementById("heroDesc").innerText = featured.desc;
        document.getElementById("heroCategory").innerText = featured.category;
        document.getElementById("heroPlayBtn").href = featured.playUrl;
        document.getElementById("heroBg").src = featured.imageUrl || "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80";
      } else {
        heroSection.classList.add("hidden");
      }

      if (filtered.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove("hidden");
      } else {
        emptyState.classList.add("hidden");
        grid.innerHTML = filtered.map(game => {
          const defaultImg = "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80";
          return `
            <div class="glass-card rounded-2xl overflow-hidden flex flex-col group relative">
              <div class="relative h-48 overflow-hidden bg-slate-800">
                <img src="${game.imageUrl || defaultImg}" alt="${game.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-purple-300 border border-slate-700/80 text-[11px] font-bold px-2.5 py-1 rounded-lg">
                  ${game.category}
                </span>

                <div class="absolute top-3 right-3 flex gap-1.5 opacity-0 group-hover:opacity-100 transition">
                  <button type="button" onclick="editGame(${game.id})" class="w-8 h-8 rounded-lg bg-slate-900/80 hover:bg-purple-600 text-slate-300 hover:text-white flex items-center justify-center transition border border-slate-700">
                    <i class="fa-solid fa-pen text-xs"></i>
                  </button>
                  <button type="button" onclick="deleteGame(${game.id})" class="w-8 h-8 rounded-lg bg-slate-900/80 hover:bg-rose-600 text-slate-300 hover:text-white flex items-center justify-center transition border border-slate-700">
                    <i class="fa-solid fa-trash text-xs"></i>
                  </button>
                </div>
              </div>

              <div class="p-5 flex-grow flex flex-col justify-between space-y-4">
                <div class="space-y-2">
                  <h3 class="font-bold text-lg text-white group-hover:text-purple-300 transition">${game.title}</h3>
                  <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${game.desc}</p>
                </div>

                <a href="${game.playUrl}" target="_blank" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-purple-600 text-slate-200 hover:text-white font-semibold text-xs transition flex items-center justify-center gap-2 border border-slate-700 hover:border-purple-500 group-hover:shadow-lg group-hover:shadow-purple-600/20">
                  <i class="fa-solid fa-play text-[10px]"></i>
                  <span>게임 플레이</span>
                </a>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function openModal(editId = null) {
      document.getElementById("editGameId").value = "";
      document.getElementById("inputTitle").value = "";
      document.getElementById("inputPlayUrl").value = "";
      document.getElementById("inputImageUrl").value = "";
      document.getElementById("inputDesc").value = "";

      if (editId) {
        document.getElementById("modalTitle").innerText = "게임 정보 수정";
        const target = games.find(g => g.id === editId);
        if (target) {
          document.getElementById("editGameId").value = target.id;
          document.getElementById("inputTitle").value = target.title;
          document.getElementById("selectCategory").value = target.category;
          document.getElementById("inputPlayUrl").value = target.playUrl;
          document.getElementById("inputImageUrl").value = target.imageUrl || "";
          document.getElementById("inputDesc").value = target.desc;
        }
      } else {
        document.getElementById("modalTitle").innerText = "새 게임 추가";
      }

      document.getElementById("gameModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("gameModal").classList.add("hidden");
    }

    function saveGameData() {
      const editId = document.getElementById("editGameId").value;
      const title = document.getElementById("inputTitle").value.trim();
      const category = document.getElementById("selectCategory").value;
      let playUrl = document.getElementById("inputPlayUrl").value.trim();
      const imageUrl = document.getElementById("inputImageUrl").value.trim();
      const desc = document.getElementById("inputDesc").value.trim();

      if (!title || !playUrl || !desc) {
        alert("게임 제목, 플레이 링크, 설명은 필수 입력 사항입니다!");
        return;
      }

      // http:// 또는 https:// 자동 보정
      if (!playUrl.startsWith("http://") && !playUrl.startsWith("https://")) {
        playUrl = "https://" + playUrl;
      }

      if (editId) {
        games = games.map(g => g.id === Number(editId) ? { ...g, title, category, playUrl, imageUrl, desc } : g);
        showToast("게임 정보가 수정되었습니다.");
      } else {
        const newGame = {
          id: Date.now(),
          title,
          category,
          playUrl,
          imageUrl,
          desc
        };
        games.unshift(newGame);
        showToast("새 게임이 등록되었습니다.");
      }

      saveGames();
      renderGames();
      closeModal();
    }

    function editGame(id) {
      openModal(id);
    }

    function deleteGame(id) {
      if (confirm("정말 이 게임을 삭제하시겠습니까?")) {
        games = games.filter(g => g.id !== id);
        saveGames();
        renderGames();
        showToast("게임이 삭제되었습니다.");
      }
    }

    function copySiteLink() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        showToast("메인 웹사이트 링크가 복사되었습니다!");
      }).catch(() => {
        showToast("링크 복사에 실패했습니다.");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 3000);
    }
  </script>
</body>
</html>
